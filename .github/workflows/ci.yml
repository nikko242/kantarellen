name: CI

on:
  push:
    branches-ignore: [kartdata]
  pull_request:
  workflow_dispatch:   # publicera om med ny kartdata (se kantarell/publicera.py)

permissions:
  contents: read
  pages: write
  id-token: write

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install -r requirements.txt
      - run: python -m pytest -q

  # Publiceras bara från main och bara när testerna gått igenom. Kartdatan ligger på grenen kartdata.
  publicera:
    needs: test
    if: github.ref == 'refs/heads/main' && github.event_name != 'pull_request'
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deploy.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/checkout@v4
        with:
          ref: kartdata
          path: web/data
      - run: rm -rf web/data/.git
      # Commiten i adressen till app.js och style.css, så att webbläsaren inte blandar ny index.html med cachad kod (Pages: max-age=600)
      - run: sed -i -E "s/(app\.js|style\.css)\"/\1?v=${GITHUB_SHA::7}\"/" web/index.html
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: web
      - id: deploy
        uses: actions/deploy-pages@v4
